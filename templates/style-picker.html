<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HTML-PPT — Skills · 风格选择器</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0b0c10;color:#e8ebf4;font-family:'Inter','PingFang SC',system-ui,sans-serif}

  /* ───── Header ───── */
  header{position:sticky;top:0;z-index:50;background:rgba(11,12,16,.92);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.08);padding:16px 32px 0;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;row-gap:14px}
  header .brand h1{margin:0;font-size:20px;letter-spacing:-.01em;font-weight:800}
  header .brand h1 .accent{background:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  header .brand .sub{color:#8a90a4;font-size:12px;margin-top:2px}

  /* 中间安装命令 */
  .install{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 6px 6px 14px;
    font-family:'JetBrains Mono','SFMono-Regular',monospace;font-size:13px;color:#cfd4e2;
    max-width:520px}
  .install .prompt{color:#6a7086;user-select:none}
  .install code{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8ebf4}
  .install button{background:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);color:#fff;border:0;
    padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;
    font-family:'Inter',sans-serif;transition:.15s;white-space:nowrap}
  .install button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(167,139,250,.4)}
  .install button.ok{background:#1aaf6c}

  /* 右上控件 */
  .controls{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .controls input[type=search]{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    color:#e8ebf4;padding:8px 14px;border-radius:8px;font-size:13px;width:200px;outline:none}
  .controls input[type=search]:focus{border-color:#a78bfa}
  .controls .size-toggle{display:flex;background:rgba(255,255,255,.05);border-radius:8px;padding:3px}
  .controls .size-toggle button{padding:6px 12px;font-size:12px;color:#aab0c0;background:transparent;
    border:0;border-radius:6px;cursor:pointer}
  .controls .size-toggle button.active{background:rgba(255,255,255,.12);color:#fff}

  /* Tabs */
  .tabs{grid-column:1/-1;display:flex;gap:4px;background:rgba(255,255,255,.05);padding:4px;
    border-radius:10px;width:fit-content;margin:0 auto;margin-top:4px}
  .tab{padding:9px 22px;font-size:13px;font-weight:600;color:#aab0c0;border:0;background:transparent;
    border-radius:7px;cursor:pointer;transition:.15s}
  .tab.active{background:#fff;color:#0b0c10}
  .tab:not(.active):hover{color:#fff;background:rgba(255,255,255,.08)}

  /* Grid */
  main{padding:28px 32px 80px}
  .grid{display:grid;gap:22px}
  .grid.size-s{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .grid.size-m{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}
  .grid.size-l{grid-template-columns:repeat(auto-fill,minmax(520px,1fr))}

  .card{background:#11131a;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;

  .card:hover{border-color:rgba(167,139,250,.5);transform:translateY(-2px);
    box-shadow:0 18px 40px rgba(0,0,0,.4)}

  .card .copy-btn{position:absolute;top:10px;left:10px;z-index:12;
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;border:0;cursor:pointer;
    background:rgba(11,12,16,.78);color:#fff;font-size:11px;font-weight:600;
    letter-spacing:.04em;backdrop-filter:blur(8px);
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    opacity:0;transform:translateY(-4px);transition:.18s;
    font-family:'Inter',sans-serif}
  .card:hover .copy-btn{opacity:1;transform:translateY(0)}
  .card .copy-btn:hover{background:rgba(167,139,250,.9)}
  .card.copied .copy-btn{opacity:1;transform:translateY(0);background:#1aaf6c}

    background:rgba(11,12,16,.7);color:#cfd4e2;backdrop-filter:blur(6px);
    opacity:0;transition:.18s;pointer-events:none;font-family:'JetBrains Mono',monospace}
  .card:hover .zoom-hint{opacity:1}
  .preview{position:relative;background:#fff;aspect-ratio:16/9;overflow:hidden}
  .preview iframe{position:absolute;top:0;left:0;width:200%;height:200%;border:0;
    transform:scale(.5);transform-origin:top left;pointer-events:none}
  .preview .badge{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:999px;
    background:rgba(0,0,0,.55);color:#fff;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    font-family:'JetBrains Mono',monospace;backdrop-filter:blur(6px);z-index:10}
  .preview .badge.extracted{background:rgba(96,165,250,.7)}
  .preview .badge.scenario{background:rgba(167,139,250,.7)}
  .meta{padding:14px 18px 16px;border-top:1px solid rgba(255,255,255,.05)}
  .meta .name{font-size:15px;font-weight:700;color:#fff;margin:0 0 4px;letter-spacing:-.005em}
  .meta .desc{font-size:12px;color:#8a90a4;margin:0;line-height:1.5}
  .meta .id{font-family:'JetBrains Mono',monospace;font-size:11px;color:#6a7086;margin-top:6px}

  .empty{padding:60px 20px;text-align:center;color:#6a7086;font-size:14px}

  /* Modal 放大预览 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;
    align-items:center;justify-content:center;padding:40px}
  .modal.open{display:flex}
  .modal-wrap{position:relative;width:min(1280px,100%);height:min(720px,100%)}
  .modal-inner{background:#fff;width:100%;height:100%;
    border-radius:14px;overflow:hidden;position:relative;box-shadow:0 40px 100px rgba(0,0,0,.6)}
  .modal-inner iframe{width:100%;height:100%;border:0;display:block}
  .modal-close{position:absolute;top:-44px;right:0;background:rgba(255,255,255,.1);color:#fff;
    border:0;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px}

  .modal-name{position:absolute;top:-44px;left:0;color:#e8ebf4;font-size:14px;

  .modal-copy{position:absolute;top:-44px;right:50px;background:linear-gradient(135deg,#a78bfa,#f472b6);

    font-weight:600;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px}
  .modal-copy:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(167,139,250,.4)}
  .modal-copy.ok{background:#1aaf6c}

  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .icon{font-size:18px}

  .guide ul{padding-left:22px;margin:8px 0}

  .guide table{width:100%;border-collapse:collapse;margin:8px 0}

  .guide table td:first-child{font-family:'JetBrains Mono',monospace;color:#a78bfa;
    width:200px;font-weight:600}
  .guide table td:last-child{color:#aab0c0}
  .guide a{color:#a78bfa;text-decoration:none;border-bottom:1px dashed rgba(167,139,250,.4)}
  .guide a:hover{color:#f472b6;border-bottom-color:#f472b6}
  .guide .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .guide .links a{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;

    border-bottom:1px solid rgba(167,139,250,.3);font-size:13px;font-weight:600}
  .guide .links a:hover{background:rgba(167,139,250,.2);border-color:#a78bfa;transform:translateY(-1px)}

    header{grid-template-columns:1fr;text-align:center}
    .install{max-width:none}
    .controls{justify-content:center}
    .tabs{margin-top:0}

/* ───── 复制 Prompt 生成器 ───── */
function themePrompt(name, zh){
  return `请使用 html-ppt skill 帮我做一份 PPT。
- 主题(theme) = ${name}（${zh}）
- 页数：8 页（你可按内容调整）
- 输出：一个完整 deck 目录，包含 index.html + 必要 CSS/JS

}

function deckPrompt(name, zh, kind){
  return `请使用 html-ppt skill 的 full-deck 模板生成一份 PPT。
- 模板(template) = ${name}（${zh}）

请生成完整可直接浏览器打开的 HTML。`;
}

/* ───── 复制 & Toast ───── */
async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); document.body.removeChild(ta); return true; }
    catch(_){ document.body.removeChild(ta); return false; }
  }
}

const toast = document.getElementById('toast');
const toastText = document.getElementById('toast-text');
let toastTimer = null;
function showToast(msg){
  toastText.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 2400);
}

    grid.style.display='none';
    emptyEl.style.display='none';
    guideEl.style.display='block';
    renderGuide();
    return;
  }
  grid.style.display='grid';
  guideEl.style.display='none';

  grid.innerHTML = '';
  const items = view==='themes' ? THEMES : DECKS;
  const filtered = items.filter(it=>{
    if(!q) return true;
    return it.join(' ').toLowerCase().includes(q.toLowerCase());
  });
  if(filtered.length===0){ emptyEl.style.display='block'; return }
  emptyEl.style.display='none';

  filtered.forEach(it=>{
    const card = document.createElement('div');
    card.className = 'card';
    let promptText, modalSrc, modalLabel;

    if(view==='themes'){
      const [name,zh,desc] = it;
      promptText = themePrompt(name, zh);
      // 用 srcdoc 而非 data: URL —— data URL 没有 base，无法解析 ../assets/ 相对路径
      modalSrc = {srcdoc: themeDemo(name,zh)};
      modalLabel = `${zh} · ${name}`;
      card.innerHTML = `
        <button class="copy-btn" type="button">📋 复制 Prompt</button>
        <span class="zoom-hint">CLICK TO ZOOM</span>
        <div class="preview">
          <iframe srcdoc='${themeDemo(name,zh).replace(/'/g,"&apos;")}' loading="lazy"></iframe>
        </div>
        <div class="meta">
          <p class="name">${zh}</p>
          <p class="desc">${desc}</p>
          <p class="id">assets/themes/${name}.css</p>
        </div>`;
    }else{
      const [name,zh,kind,desc] = it;
      promptText = deckPrompt(name, zh, kind);
      modalSrc = {src: `full-decks/${name}/index.html`};
      modalLabel = `${zh} · ${name}`;
      card.innerHTML = `
        <button class="copy-btn" type="button">📋 复制 Prompt</button>
        <span class="zoom-hint">CLICK TO ZOOM</span>
        <div class="preview">
          <span class="badge ${kind}">${kind}</span>
          <iframe src="full-decks/${name}/index.html" loading="lazy"></iframe>
        </div>
        <div class="meta">
          <p class="name">${zh}</p>
          <p class="desc">${desc}</p>
          <p class="id">templates/full-decks/${name}/</p>
        </div>`;
    }

    // 整卡点击 → 放大预览（携带 prompt 供 modal 复制用）
    card.addEventListener('click',()=>openModal(modalSrc, modalLabel, promptText));

    // 右上角复制按钮 → 复制 Prompt，不冒泡
    const copyBtn = card.querySelector('.copy-btn');
    copyBtn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ok = await copyToClipboard(promptText);
      if(ok){
        card.classList.add('copied');
        copyBtn.textContent = '✓ 已复制';
        showToast(`已复制「${card.querySelector('.name').textContent}」Prompt — 粘到 Agent 即用`);
        setTimeout(()=>{
          card.classList.remove('copied');
          copyBtn.textContent = '📋 复制 Prompt';
        }, 2400);
      }else{
        showToast('复制失败，请手动选中文本');
      }
    });

    grid.appendChild(card);
  });
}

/* ───── Modal 放大预览 ───── */
const modal = document.getElementById('modal');
const modalIframe = document.getElementById('modal-iframe');
const modalName = document.getElementById('modal-name');
const modalCopy = document.getElementById('modal-copy');
let modalPrompt = '';
function openModal(src, name, prompt){
  // src 形如 {srcdoc:'...'} 或 {src:'...'}；先清空两个属性避免互相干扰
  modalIframe.removeAttribute('srcdoc');
  modalIframe.removeAttribute('src');
  if(src && typeof src === 'object' && 'srcdoc' in src){
    modalIframe.srcdoc = src.srcdoc;
  }else if(src && typeof src === 'object' && 'src' in src){
    modalIframe.src = src.src;
  }else if(typeof src === 'string'){
    modalIframe.src = src; // 兜底旧调用
  }
  modalName.textContent = name;
  modalPrompt = prompt || '';
  modalCopy.style.display = prompt ? 'inline-flex' : 'none';
  modalCopy.textContent = '📋 复制 Prompt';
  modalCopy.classList.remove('ok');
  modal.classList.add('open');
}
function closeModal(){
  modal.classList.remove('open');
  modalIframe.removeAttribute('srcdoc');
  modalIframe.removeAttribute('src');
}
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
modalCopy.addEventListener('click', async e => {
  e.stopPropagation();
  if(!modalPrompt) return;
  const ok = await copyToClipboard(modalPrompt);
  if(ok){
    modalCopy.textContent = '✓ 已复制';
    modalCopy.classList.add('ok');
    showToast('已复制 Prompt — 粘到 Agent 即用');
    setTimeout(()=>{
      modalCopy.textContent = '📋 复制 Prompt';
      modalCopy.classList.remove('ok');
    }, 2000);
  }
});

render();
